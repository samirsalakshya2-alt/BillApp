<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>BillApp — Agrawal Galla Bhandar</title>
  <meta name="description" content="Offline billing app for Agrawal Galla Bhandar" />
  <meta name="theme-color" content="#14532d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BillApp" />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/invoice-print.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <noscript>BillApp requires JavaScript to run.</noscript>

  <div id="app">
    <header id="appHeader" class="app-header"></header>
    <main id="appMain" class="app-main"></main>
    <div id="bottomNavRoot"></div>
    <div id="fabRoot"></div>
    <div id="toastRoot" class="toast-stack"></div>
  </div>

  <!-- Vendored locally (no CDN) so PDF export works fully offline. Classic scripts,
       loaded before the module script so window.jspdf/window.html2canvas exist by the
       time pdfService.js needs them (Share/Download PDF are user-triggered, well after load). -->
  <script src="libs/jspdf.umd.min.js"></script>
  <script src="libs/html2canvas.min.js"></script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
